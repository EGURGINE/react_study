name: Deploy roam to GitHub Pages
on:
  push:
    branches: [main, master, codex/roam-portfolio]
  workflow_dispatch:
permissions:
  actions: read
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: roam
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: roam/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          VITE_MULTIPLAYER_URL: ${{ vars.VITE_MULTIPLAYER_URL }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: roam/dist
      - name: Wait for Pages artifact metadata
        uses: actions/github-script@v7
        with:
          script: |
            for (let attempt = 0; attempt < 30; attempt++) {
              const { data } = await github.rest.actions.listWorkflowRunArtifacts({
                ...context.repo,
                run_id: context.runId,
              });
              if (data.artifacts.some(artifact => artifact.name === 'github-pages' && !artifact.expired)) {
                return;
              }
              core.info('Waiting for the uploaded Pages artifact to become visible.');
              await new Promise(resolve => setTimeout(resolve, 2000));
            }
            core.setFailed('The Pages artifact was uploaded but its metadata did not become available within 60 seconds.');
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
