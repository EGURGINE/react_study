services:
  - type: web
    name: roam-multiplayer
    runtime: node
    plan: free
    rootDir: roam
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    numInstances: 1
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: ALLOWED_ORIGINS
        value: https://egurgine.github.io
